name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  php-lint:
    name: PHP Syntax (${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: [ '8.0', '8.1', '8.2', '8.3', '8.4' ]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: PHP syntax check
        run: find rankmyseo.php uninstall.php includes tests/php -name '*.php' -print0 | xargs -0 -n1 php -l

  php-qa:
    name: PHPCS, PHPStan & PHPUnit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Run PHPCS (WPCS + PHPCompatibility)
        run: composer phpcs

      - name: Run PHPStan
        run: composer phpstan

      - name: Run PHPUnit
        run: composer test

  js-qa:
    name: TypeScript, Lint, Build & Jest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: ESLint
        run: npm run lint:js

      - name: Stylelint
        run: npm run lint:css

      - name: Build production assets
        run: npm run build

      - name: Jest unit tests
        run: npm run test:js -- --ci

  plugin-check:
    name: WordPress Plugin Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Build assets for plugin check
        run: npm ci && npm run build

      - name: Run WordPress Plugin Check
        uses: WordPress/plugin-check-action@v1
        with:
          # Directory name is the GitHub repo; the WordPress.org text domain is rankmyseo.
          slug: rankmyseo
          exclude-directories: '.git,.github,node_modules,tests,vendor'
          exclude-files: '.eslintrc.js,.gitignore,.stylelintrc.json,.wp-env.json,composer.json,composer.lock,jest.config.js,package.json,package-lock.json,phpcs.xml.dist,phpstan-bootstrap.php,phpstan.neon.dist,phpunit.xml.dist,README.md,tsconfig.json,webpack.config.js'
